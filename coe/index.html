<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Text</title>
    <style>
        .career-text {
            font-size: 48px;
            font-weight: bold;
            color: #1a1a1a;
            display: inline-block;
            position: relative;
            padding: 5px 10px;
        }

        .career-text::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 10px; /* Điều chỉnh khoảng cách giữa chữ và nền xanh */
            width: 100%;
            height: 20px; /* Chiều cao của phần nền xanh */
            background-color: #9acd72; /* Màu xanh của phần nền */
            z-index: -1;
        }
    </style>
</head>
<body>

    <span class="career-text">Career</span>

</body>
</html>
